spring.application.name=aiPoc

# Configuration Spring AI Vertex AI Gemini
spring.ai.vertex.ai.gemini.project-id=${SPRING_AI_VERTEXAI_GEMINI_PROJECT_ID}
spring.ai.vertex.ai.gemini.location=${SPRING_AI_VERTEXAI_GEMINI_LOCATION:us-central1}

# Configuration de la base de données
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ollca}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration SQL init
spring.sql.init.mode=always

# Configuration Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Niveau de logging
logging.level.root=INFO
logging.level.com.example.aiPoc=INFO
logging.level.org.springframework.ai=DEBUG

# Format des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Fichier de logs
logging.file.name=logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
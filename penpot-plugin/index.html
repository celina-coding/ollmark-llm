<body>
  <div id="app" class="app">
    <header class="topbar">
  <div class="conn-status">
    <span id="wsStatusDot" class="status-dot disconnected"></span>

    <button id="connectBtn" class="btn primary">
      Se connecter au serveur MCP
    </button>
  </div>

  <div class="spacer"></div>

  <div class="mode">
    <select id="modeSelect" class="select">
      <option value="chat" selected>Chat</option>
      <option value="js">Executer JavaScript</option>
    </select>
  </div>
</header>


    <!-- LA PANEL DU CHAAAAAAAAAAAT -->
    <section id="chatPanel" class="panel">
      <div class="chat-wrap">
        <div id="chatBox" class="chat-box"></div>

        <div class="chat-input">
          <input id="chatMsg" class="chat-text" placeholder="Que voulez vous generer?" />
          <button id="sendChatBtn" class="send-btn" type="button" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" class="send-ico" aria-hidden="true">
              <path d="M12 5l6 6-1.4 1.4L13 8.8V20h-2V8.8L7.4 12.4 6 11l6-6z"></path>
            </svg>
          </button>


        </div>
      </div>

      <div class="hidden-tools">
        <button id="newConvBtn"></button>
        <button id="deleteConvBtn"></button>
        <input id="conversationId" />
      </div>

      <div class="mini-row">
        <button id="newConvBtn2" type="button" class="btn ghost">Nouvelle conversation</button>
        <button id="deleteConvBtn2" type="button" class="btn ghost danger">Reinitialiser cette conversation</button>
      </div>
    </section>

    <!-- LA PANEL DU JAVASCRIIIIIIPTTTTTT -->
    <section id="jsPanel" class="panel" style="display:none;">
      <div class="card">
        <div class="card-title">Code JavaScript a executer</div>
        <textarea id="jsCode" class="code" rows="8">console.log("test");</textarea>
        <div class="row">
          <button id="runJsBtn" class="btn primary">Executer JS</button>
        </div>
      </div>
    </section>

    <!-- LOGS -->
    <section class="panel">
      <div class="card">
        <div class="row">
          <div class="card-title">Logs</div>
          <div class="spacer"></div>
          <button id="clearLogsBtn2" class="btn ghost">Reinitialiser</button>
        </div>
        <pre id="logs" class="logs"></pre>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
